[project]
name = "text-analysis-lambda-service"
version = "1.0.0"
description = "Flask API that extracts place names from text with spaCy models cached from S3"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.format]
quote-style = "single"
